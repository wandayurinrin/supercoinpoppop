<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>探金小秘書</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* 隱藏橫向滾動條，保持畫面潔淨 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const generateId = () => Math.random().toString(36).substr(2, 9);

        // ==========================================
        // 🔑 API 相關設定（直接寫死確保 App 內部可正常讀取）
        // ==========================================
        const apiKey = "AQ.Ab8RN6IMdhfb8qKSu32xbAp2VpyGqm0Op7RfAE8KJu2bcslkgQ"; 
        const GOOGLE_CLIENT_ID = "";
        // ==========================================

        const INITIAL_SETTINGS = {
          fixedPersonnel: [
            { name: '帥志', fullDayRate: 2500, halfDayRate: 1300 },
            { name: '阿童', fullDayRate: 2500, halfDayRate: 1300 },
            { name: '阿和', fullDayRate: 2500, halfDayRate: 1300 },
            { name: '阿翔', fullDayRate: 2500, halfDayRate: 1300 },
            { name: '阿孝', fullDayRate: 2500, halfDayRate: 1300 }
          ],
          companyName: '',
          taxId: '',
          phone: ''
        };

        const getDefaultBillingDate = (yearMonthStr) => {
          if (!yearMonthStr) return new Date().toISOString().split('T')[0];
          const [y, m] = yearMonthStr.split('-');
          let nextYear = parseInt(y, 10);
          let nextMonth = parseInt(m, 10) + 1;
          if (nextMonth > 12) {
            nextMonth = 1;
            nextYear += 1;
          }
          const mStr = String(nextMonth).padStart(2, '0');
          return `${nextYear}-${mStr}-05`;
        };

        const emptyRecordForm = () => {
          const defaultMonth = new Date().toISOString().slice(0, 7);
          return {
            id: null,
            type: 'contract', 
            projectName: '',
            date: new Date().toISOString().split('T')[0],
            startTime: '08:00',
            endTime: '17:00',
            location: '',
            client: '',
            personnel: [],
            tasks: [],
            customItems: [], 
            manualBilling: '',
            billingDate: getDefaultBillingDate(defaultMonth),
            collectionDate: '',
            isCollected: false,
            costs: {
              fuel: { cost: 0, billable: false, billingAmount: 0 },
              food: { cost: 0, billable: false, billingAmount: 0 },
              other: { cost: 0, billable: false, billingAmount: 0 }
            },
            remarks: ''
          };
        };

        const sanitizeRecord = (record) => {
          if (!record) return emptyRecordForm();
          return {
            ...emptyRecordForm(),
            ...record,
            costs: {
              fuel: { cost: 0, billable: false, billingAmount: 0, ...(record.costs?.fuel || {}) },
              food: { cost: 0, billable: false, billingAmount: 0, ...(record.costs?.food || {}) },
              other: { cost: 0, billable: false, billingAmount: 0, ...(record.costs?.other || {}) }
            },
            personnel: Array.isArray(record.personnel) ? record.personnel : [],
            tasks: Array.isArray(record.tasks) ? record.tasks : [],
            customItems: Array.isArray(record.customItems) ? record.customItems : []
          };
        };

        const TIME_OPTIONS = [];
        for (let h = 0; h < 24; h++) {
          const hourStr = String(h).padStart(2, '0');
          TIME_OPTIONS.push(`${hourStr}:00`);
          TIME_OPTIONS.push(`${hourStr}:30`);
        }

        const callGeminiAPI = async (text) => {
          if (!apiKey) {
            throw new Error("請先填入有效的 API 金鑰");
          }

          const systemPrompt = "你是一個專業的工程紀錄助理。請從以下工程日誌中提取資訊，並回傳格式嚴謹的 JSON 物件。時間請一律轉換為 24 小時制（HH:mm格式）。";
          const userQuery = `
            日誌內容：
            ${text}

            JSON 結構必須完全符合以下格式，若未提及的數字請填 0，字串請留空：
            {
              "type": "contract",
              "projectName": "工程名稱",
              "date": "YYYY-MM-DD",
              "startTime": "HH:MM",
              "endTime": "HH:MM",
              "location": "地點",
              "client": "請款對象/客戶",
              "personnel": [
                { "name": "人名", "dayType": "full" 或 "half", "dailyRate": 數字, "overtimePay": 數字, "bonus": 數字, "billable": false }
              ],
              "tasks": [
                { "description": "工作項目描述", "laborCost": 數字, "materialCost": 數字, "billingAmount": 數字, "billable": false }
              ],
              "customItems": [
                { "name": "物品名稱", "qty": 數字, "price": 數字, "billable": false }
              ],
              "costs": {
                "fuel": { "cost": 數字, "billable": false, "billingAmount": 數字 },
                "food": { "cost": 數字, "billable": false, "billingAmount": 數字 },
                "other": { "cost": 數字, "billable": false, "billingAmount": 數字 }
              },
              "remarks": "備註內容"
            }
            請只回傳合法的 JSON 字串。
          `;

          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;
          
          let response;
          for (let attempt = 0; attempt < 5; attempt++) {
            response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ 
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
              })
            });
            if (response.ok) break;
            await new Promise(r => setTimeout(r, Math.pow(2, attempt) * 1000));
          }

          if (!response || !response.ok) {
            throw new Error('API 請求失敗，請檢查金鑰或網路連線');
          }

          const data = await response.json();
          let resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!resultText) throw new Error('AI 未回傳任何內容');

          resultText = resultText.replace(/```json/g, '').replace(/```/g, '').trim();
          return JSON.parse(resultText);
        };

        // ==========================================
        // 🖼️ 絕不閃退的純 Canvas 圖片匯出工具 (App 專用修正版)
        // ==========================================
        const exportSingleDocumentAsImage = (type, data, settings) => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          
          let rows = [];
          if (type === 'invoice') rows = data.records || [];
          if (type === 'salary') rows = data.details || [];
          if (type === 'quotation') rows = [...(data.tasks || []), ...(data.customItems || [])];

          let materials = [];
          if (type === 'invoice') {
            (data.records || []).forEach(r => {
              (r.customItems || []).forEach(c => {
                materials.push({ date: r.date, name: c.name, price: (Number(c.qty)||0) * (Number(c.price)||0) });
              });
            });
          }

          // 1. 動態計算完美高度，避免留白太多
          let currentY = 60; // 上方邊距
          currentY += 40; // 標題
          let subInfo = '';
          if (settings.taxId) subInfo += `統一編號：${settings.taxId}   `;
          if (settings.phone) subInfo += `電話：${settings.phone}`;
          if (subInfo) currentY += 35;
          
          currentY += 50; // 單據名稱
          currentY += 120; // 資訊卡
          if (type === 'invoice') currentY += 100; // 請款單四個總計方塊
          
          currentY += 50; // 表格標題
          currentY += rows.length * 50; // 表格內容列 (加大了行高)
          
          if (type === 'invoice' && materials.length > 0) {
            currentY += 60; // 間距
            currentY += 50; // 材料表格標題
            currentY += materials.length * 50; // 材料表格內容
          }

          currentY += 60; // 總計區間距
          currentY += 70; // 總計區塊
          currentY += 60; // 底部留白

          // 設定較適合手機閱讀的寬度 800，並套用剛剛計算的完美高度
          canvas.width = 800;
          canvas.height = currentY;

          // 背景填白
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          currentY = 60;

          // 標題
          ctx.fillStyle = '#0f172a';
          ctx.font = 'bold 32px sans-serif'; // 字體相對寬度變大
          ctx.textAlign = 'center';
          ctx.fillText(settings.companyName || '工程行', canvas.width / 2, currentY);

          currentY += 35;
          ctx.font = '16px sans-serif';
          ctx.fillStyle = '#475569';
          if (subInfo) {
            ctx.fillText(subInfo, canvas.width / 2, currentY);
            currentY += 35;
          }

          let docTitle = '請 款 單';
          let themeColor = '#1d4ed8';
          if (type === 'salary') { docTitle = '薪 資 結 算 單'; themeColor = '#047857'; }
          if (type === 'quotation') { docTitle = '報 價 單'; themeColor = '#d97706'; }

          ctx.font = 'bold 26px sans-serif';
          ctx.fillStyle = themeColor;
          ctx.fillText(docTitle, canvas.width / 2, currentY);

          currentY += 50;

          // 資訊卡外框
          ctx.fillStyle = '#f8fafc';
          ctx.strokeStyle = '#e2e8f0';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(40, currentY, 720, 90, 10);
          ctx.fill();
          ctx.stroke();

          ctx.font = 'bold 18px sans-serif';
          ctx.fillStyle = '#1e293b';
          ctx.textAlign = 'left';

          if (type === 'invoice') {
            ctx.fillText(`客戶抬頭：${data.client}`, 60, currentY + 35);
            ctx.fillText(`請款月份：${data.month}`, 60, currentY + 70);
            ctx.textAlign = 'right';
            ctx.fillText(`填表日期：${new Date().toISOString().slice(0, 10)}`, 740, currentY + 35);
            ctx.fillText(`狀態：${data.isCollected ? '已收款' : '未收款'}`, 740, currentY + 70);
          } else if (type === 'salary') {
            ctx.fillText(`員工姓名：${data.name}`, 60, currentY + 35);
            ctx.fillText(`薪資月份：${data.month}`, 60, currentY + 70);
            ctx.textAlign = 'right';
            ctx.fillText(`總出勤天數：${data.totalDays} 天`, 740, currentY + 52);
          } else if (type === 'quotation') {
            ctx.fillText(`客戶抬頭：${data.client}`, 60, currentY + 35);
            ctx.fillText(`工程名稱：${data.projectName}`, 60, currentY + 70);
            ctx.textAlign = 'right';
            ctx.fillText(`報價日期：${data.date}`, 740, currentY + 52);
          }

          currentY += 120;

          // 金額摘要小方塊
          if (type === 'invoice') {
            const boxW = 170;
            const boxes = [
              { label: '工費總計', val: `$${data.totalLabor.toLocaleString()}` },
              { label: '料錢總計', val: `$${data.totalMaterial.toLocaleString()}` },
              { label: '各項費用', val: `$${data.totalExpenses.toLocaleString()}` },
              { label: '小計金額', val: `$${data.grandTotal.toLocaleString()}` }
            ];
            boxes.forEach((b, idx) => {
              const bx = 40 + idx * 183;
              ctx.fillStyle = '#f8fafc';
              ctx.strokeStyle = '#cbd5e1';
              ctx.beginPath();
              ctx.roundRect(bx, currentY, boxW, 70, 8);
              ctx.fill();
              ctx.stroke();

              ctx.font = '14px sans-serif';
              ctx.fillStyle = '#64748b';
              ctx.textAlign = 'center';
              ctx.fillText(b.label, bx + boxW / 2, currentY + 28);

              ctx.font = 'bold 18px sans-serif';
              ctx.fillStyle = '#0f172a';
              ctx.fillText(b.val, bx + boxW / 2, currentY + 55);
            });
            currentY += 100;
          }

          // 主表格標題
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.roundRect(40, currentY, 720, 45, 6);
          ctx.fill();

          ctx.font = 'bold 16px sans-serif';
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'left';

          if (type === 'invoice') {
            ctx.fillText('日期', 60, currentY + 28);
            ctx.fillText('工程/摘要', 180, currentY + 28);
            ctx.textAlign = 'center';
            ctx.fillText('人數', 420, currentY + 28);
            ctx.textAlign = 'right';
            ctx.fillText('工錢', 530, currentY + 28);
            ctx.fillText('其他', 630, currentY + 28);
            ctx.fillText('總額', 740, currentY + 28);
          } else if (type === 'salary') {
            ctx.fillText('日期', 60, currentY + 28);
            ctx.fillText('工程名稱', 200, currentY + 28);
            ctx.textAlign = 'center';
            ctx.fillText('班別', 450, currentY + 28);
            ctx.textAlign = 'right';
            ctx.fillText('日薪', 560, currentY + 28);
            ctx.fillText('加班', 650, currentY + 28);
            ctx.fillText('小計', 740, currentY + 28);
          } else if (type === 'quotation') {
            ctx.fillText('項目描述', 60, currentY + 28);
            ctx.textAlign = 'right';
            ctx.fillText('報價金額', 740, currentY + 28);
          }

          currentY += 45;

          // 繪製表格內容
          ctx.font = '16px sans-serif';

          rows.forEach((r, idx) => {
            currentY += 50;
            if (idx % 2 === 1) {
              ctx.fillStyle = '#f8fafc';
              ctx.fillRect(40, currentY - 35, 720, 50);
            }

            ctx.fillStyle = '#1e293b';
            ctx.textAlign = 'left';

            if (type === 'invoice') {
              const pCount = (r.personnel || []).length;
              let labor = 0;
              (r.personnel || []).forEach(p => { labor += (Number(p.dailyRate)||0) + (Number(p.overtimePay)||0) + (Number(p.bonus)||0); });
              (r.tasks || []).forEach(t => { labor += Number(t.laborCost)||0; });
              let exp = 0;
              ['fuel', 'food', 'other'].forEach(k => { exp += Number(r.costs?.[k]?.cost) || 0; });
              const desc = r.tasks?.[0]?.description || r.remarks || data.projectName;

              ctx.fillText(r.date.slice(5), 60, currentY - 5); // 只顯示 MM-DD
              ctx.fillText(desc.length > 12 ? desc.slice(0, 12) + '...' : desc, 180, currentY - 5);
              ctx.textAlign = 'center';
              ctx.fillText(pCount, 420, currentY - 5);
              ctx.textAlign = 'right';
              ctx.fillText(`$${labor.toLocaleString()}`, 530, currentY - 5);
              ctx.fillText(`$${exp.toLocaleString()}`, 630, currentY - 5);
              ctx.fillStyle = '#2563eb';
              ctx.font = 'bold 16px sans-serif';
              ctx.fillText(`$${(r.summary?.totalBilling || 0).toLocaleString()}`, 740, currentY - 5);
              ctx.font = '16px sans-serif';
            } else if (type === 'salary') {
              ctx.fillText(r.date.slice(5), 60, currentY - 5);
              ctx.fillText(r.projectName.length > 13 ? r.projectName.slice(0, 13) + '...' : r.projectName, 200, currentY - 5);
              ctx.textAlign = 'center';
              ctx.fillText(r.dayType, 450, currentY - 5);
              ctx.textAlign = 'right';
              ctx.fillText(`$${r.dailyRate.toLocaleString()}`, 560, currentY - 5);
              ctx.fillText(`$${r.overtime.toLocaleString()}`, 650, currentY - 5);
              ctx.fillStyle = '#2563eb';
              ctx.font = 'bold 16px sans-serif';
              ctx.fillText(`$${r.subTotal.toLocaleString()}`, 740, currentY - 5);
              ctx.font = '16px sans-serif';
            } else if (type === 'quotation') {
              const desc = r.description || `${r.name} (x${r.qty})`;
              const amt = r.billingAmount !== undefined ? Number(r.billingAmount) : (Number(r.qty || 1) * Number(r.price || 0));
              ctx.fillText(desc, 60, currentY - 5);
              ctx.textAlign = 'right';
              ctx.fillStyle = '#2563eb';
              ctx.font = 'bold 18px sans-serif';
              ctx.fillText(`$${amt.toLocaleString()}`, 740, currentY - 5);
              ctx.font = '16px sans-serif';
            }
          });

          // 如果是請款單且有材料明細，則在圖片中額外畫出材料表格
          if (type === 'invoice' && materials.length > 0) {
            currentY += 60;
            
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.roundRect(40, currentY, 720, 45, 6);
            ctx.fill();

            ctx.font = 'bold 16px sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'left';
            ctx.fillText('日期', 60, currentY + 28);
            ctx.fillText('材料名稱', 200, currentY + 28);
            ctx.textAlign = 'right';
            ctx.fillText('價格', 740, currentY + 28);

            currentY += 45;
            ctx.font = '16px sans-serif';
            materials.forEach((m, idx) => {
              currentY += 50;
              if (idx % 2 === 1) {
                ctx.fillStyle = '#f8fafc';
                ctx.fillRect(40, currentY - 35, 720, 50);
              }

              ctx.fillStyle = '#1e293b';
              ctx.textAlign = 'left';
              ctx.fillText(m.date.slice(5), 60, currentY - 5);
              ctx.fillText(m.name, 200, currentY - 5);
              ctx.textAlign = 'right';
              ctx.font = 'bold 16px sans-serif';
              ctx.fillText(`$${m.price.toLocaleString()}`, 740, currentY - 5);
              ctx.font = '16px sans-serif'; 
            });
          }

          currentY += 60;

          // 底部總計列
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.roundRect(40, currentY, 720, 70, 10);
          ctx.fill();

          ctx.font = 'bold 22px sans-serif';
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'left';
          ctx.fillText('總計金額', 70, currentY + 45);

          ctx.font = 'bold 28px sans-serif';
          ctx.fillStyle = '#34d399';
          ctx.textAlign = 'right';
          let finalTotal = type === 'invoice' ? data.grandTotal : (type === 'salary' ? data.totalSalary : (data.summary?.totalBilling || 0));
          ctx.fillText(`$${finalTotal.toLocaleString()} 元整`, 730, currentY + 47);

          // 產生 Base64 圖片 URL
          const dataUrl = canvas.toDataURL('image/png');
          const filename = `${docTitle.replace(/\s+/g, '')}_${data.client || data.name || '明細'}.png`;

          // 2. 徹底解決 WebIntoApp 點擊「儲存圖片」按鈕會閃退的問題
          // 在 Android WebView 包裝中，強制執行 a.click() 常常會觸發檔案權限或未處理的 Intent 導致閃退。
          // 改為安全的 Modal 展示，並且提供「手機長按圖片儲存」或「直接使用新分頁/Blob下載」的完全穩定防閃退設計。
          const modal = document.createElement('div');
          modal.style.cssText = 'position:fixed; inset:0; background:rgba(15,23,42,0.95); z-index:999999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom); backdrop-filter:blur(4px);';
          
          const topBar = document.createElement('div');
          topBar.style.cssText = 'width:100%; max-width:800px; display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-shrink:0;';
          
          const hintText = document.createElement('p');
          hintText.innerText = '💡 請「長按下方圖片」選擇下載或儲存到手機相簿';
          hintText.style.cssText = 'color:#34d399; font-weight:bold; font-size:14px; margin:0; text-shadow: 0 1px 2px rgba(0,0,0,0.5);';
          
          const closeBtn = document.createElement('button');
          closeBtn.innerText = '✕ 關閉';
          closeBtn.style.cssText = 'background:#ef4444; color:white; border:none; padding:8px 16px; border-radius:8px; font-weight:bold; font-size:14px; cursor:pointer; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);';
          closeBtn.onclick = () => document.body.removeChild(modal);
          
          topBar.appendChild(hintText);
          topBar.appendChild(closeBtn);
          
          const imgContainer = document.createElement('div');
          imgContainer.style.cssText = 'width:100%; max-width:800px; height:82vh; overflow-y:auto; border-radius:12px; background:white; display:flex; flex-direction:column; align-items:center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); -webkit-overflow-scrolling: touch;';
          
          const img = document.createElement('img');
          img.src = dataUrl;
          // 確保圖片在 APP 中可以被長按反白/存檔，絕對不呼叫會閃退的自動 a.click()
          img.style.cssText = 'width:100%; height:auto; display:block; -webkit-touch-callout: default !important; user-select: auto !important; pointer-events: auto !important;';
          
          imgContainer.appendChild(img);
          modal.appendChild(topBar);
          modal.appendChild(imgContainer);
          
          document.body.appendChild(modal);
        };

        // ==========================================
        // 柔和風格 SVG 圖示元件
        // ==========================================
        const SoftIcon = ({ type, className = "w-5 h-5" }) => {
            const baseProps = {
                className,
                fill: "none",
                stroke: "currentColor",
                strokeWidth: "2",
                strokeLinecap: "round",
                strokeLinejoin: "round"
            };
            switch(type) {
                case 'input': return <svg {...baseProps} viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>;
                case 'billing': return <svg {...baseProps} viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>;
                case 'salary': return <svg {...baseProps} viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>;

                    </div>

                    <div className="p-3 bg-white text-slate-800 space-y-2 text-[10px]">
                      <div className="text-center pb-2 border-b-2 border-slate-900">
                        <h2 className="text-base font-black text-slate-900 tracking-wider mb-0.5">{settings.companyName || '工程行'}</h2>
                        <div className="text-[9px] text-slate-600 font-medium space-x-2">

                      <div className="flex justify-between items-start bg-slate-50 p-2 rounded-lg border border-slate-200">

                        <div className="text-right space-y-0.5">
                          <p><strong className="text-slate-500">報價日期：</strong> <span className="font-mono">{officialQuotationModal.date}</span></p>
                        </div>
                      </div>

                      <div className="space-y-1">
                        <h4 className="font-bold text-slate-700 uppercase tracking-wider text-[10px]">報價項目明細</h4>
                        <div className="border border-slate-200 rounded-lg overflow-x-auto hide-scrollbar">
                          <table className="w-full min-w-full text-left border-collapse text-[9px] sm:text-[10px]">
                            <thead>
                              <tr className="bg-slate-900 text-white font-bold whitespace-nowrap">
                                <th className="px-2 py-1.5 w-full">項目描述</th>

                            <tbody className="divide-y divide-slate-100">
                              {(officialQuotationModal.tasks || []).map((t, idx) => (

                                  <td className="px-2 py-1.5 font-bold text-slate-900">{t.description}</td>

                                  <td className="px-2 py-1.5 text-right font-medium text-slate-700">${((Number(c.qty)||0) * (Number(c.price)||0)).toLocaleString()}</td>
                                </tr>
                              ))}
                            </tbody>

                      </div>
                      
                      {officialQuotationModal.remarks && (
                        <div className="mt-2 p-2 bg-slate-50 rounded-lg border border-slate-200 text-[10px] text-slate-600">
                          <strong className="text-slate-800">備註事項：</strong><br/>
                          {officialQuotationModal.remarks}
                        </div>
                      )}

                      <div className="bg-slate-900 text-white p-2.5 rounded-lg flex justify-between items-center gap-1 mt-2">
                        <span className="text-[11px] font-medium whitespace-nowrap">總計報價金額</span>
                        <span className="text-base sm:text-lg font-black text-amber-400 whitespace-nowrap">${(officialQuotationModal.summary?.totalBilling || 0).toLocaleString()} 元整</span>
                      </div>
                    </div>

                    <div className="p-2 bg-slate-50 border-t border-slate-200 flex flex-wrap gap-2 shrink-0">
                      <button 
                        onClick={() => exportSingleDocumentAsImage('quotation', officialQuotationModal, settings)}
                        className="flex-1 min-w-[100px] bg-indigo-600 hover:bg-indigo-700 text-white py-1.5 rounded-lg text-xs font-bold cursor-pointer shadow-sm whitespace-nowrap"
                      >
                        🖼️ 儲存圖片
                      </button>
                      <button 
                        onClick={() => {
                          let text = `【 ${settings.companyName || '工程行'} 報價單 】\n`;
                          text += `客戶抬頭：${officialQuotationModal.client}\n`;
                          text += `報價日期：${officialQuotationModal.date}\n`;
                          text += `----------------------------------------\n`;
                          (officialQuotationModal.tasks || []).forEach(t => {
                            text += `• ${t.description}：$${t.billingAmount}\n`;
                          });
                          (officialQuotationModal.customItems || []).forEach(c => {
                            text += `• ${c.name} (x${c.qty})：$${((Number(c.qty)||0) * (Number(c.price)||0))}\n`;
                          });
                          text += `----------------------------------------\n`;
                          text += `💰 總計報價金額：$${(officialQuotationModal.summary?.totalBilling || 0).toLocaleString()} 元\n`;
                          navigator.clipboard.writeText(text);
                          showToast('已成功複製報價單文字！可直接貼到 LINE 傳給客戶');

                        className="flex-1 min-w-[100px] bg-amber-600 hover:bg-amber-700 text-white py-1.5 rounded-lg text-xs font-bold cursor-pointer shadow-sm whitespace-nowrap"
                      >
                        📋 複製文字
                      </button>
                      <button onClick={() => setOfficialQuotationModal(null)} className="w-full sm:w-auto px-4 bg-slate-200 hover:bg-slate-300 text-slate-700 py-1.5 rounded-lg text-xs font-semibold cursor-pointer shrink-0">
                        關閉
                      </button>
                    </div>
                  </div>
                </div>
              )}

              <header className="bg-slate-900 text-white sticky top-0 z-40 border-b border-slate-800 print:hidden">
                <div className="max-w-7xl mx-auto px-3 py-2 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="bg-blue-600 p-1.5 rounded-lg text-white">
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h1 className="text-sm font-bold">探金小秘書</h1>
                  </div>
                  <nav className="hidden md:flex gap-1">
                    {navItems.map(tab => (
                      <button key={tab.id} onClick={() => { if(tab.id==='input') setEditingRecord(null); setActiveTab(tab.id); }} className={`px-2.5 py-1.5 rounded-lg text-xs cursor-pointer flex items-center gap-1.5 ${activeTab === tab.id ? 'bg-blue-600 font-bold text-white' : 'hover:bg-slate-800 text-slate-300'}`}>

                        <span>{tab.label}</span>
                      </button>
                    ))}
                  </nav>
                </div>
              </header>

              <main className="max-w-5xl mx-auto px-2 py-3">
                {activeTab === 'input' && <InputView onSave={handleSaveRecord} settings={settings} initialData={editingRecord} onCancelEdit={() => setEditingRecord(null)} />}
                {activeTab === 'billing' && <BillingView records={records} settings={settings} onUpdateRecord={handleUpdateRecord} setOfficialInvoiceModal={setOfficialInvoiceModal} />}
                {activeTab === 'salary' && <SalaryView records={records} settings={settings} setOfficialSalaryModal={setOfficialSalaryModal} />}
                {activeTab === 'quotation' && <QuotationView records={records} settings={settings} onEdit={handleStartEdit} onDelete={(id) => setDeleteTarget(id)} setOfficialQuotationModal={setOfficialQuotationModal} />}
                {activeTab === 'monthly' && <MonthlyReportView records={records} onDelete={(id) => setDeleteTarget(id)} onEdit={handleStartEdit} />}
                {activeTab === 'stats' && <StatsView records={records} />}
                {activeTab === 'settings' && <SettingsView settings={settings} onSave={updateSettings} records={records} setRecords={setRecords} showToast={showToast} />}
              </main>

              {/* 導覽列 (柔和風格 SVG 圖示) */}
              <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around px-1 pt-1.5 pb-[calc(env(safe-area-inset-bottom)+0.375rem)] z-40 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] print:hidden overflow-x-hidden">
                {navItems.map(tab => (
                  <button 
                    key={tab.id}
                    onClick={() => { if(tab.id==='input') setEditingRecord(null); setActiveTab(tab.id); }} 
                    className={`flex flex-col items-center justify-center py-1 min-w-[45px] rounded text-[10px] cursor-pointer ${activeTab === tab.id ? 'text-blue-600 font-bold scale-110 transition-transform' : 'text-slate-400 font-medium hover:text-slate-600'}`}
                  >
                    <span className="mb-1 flex items-center justify-center">{tab.icon}</span>
                    <span>{tab.label}</span>
                  </button>
                ))}
              </nav>
            </div>
          );
        }

        const Card = ({ children, title, className = "" }) => (
          <div className={`bg-white rounded-xl shadow-2xs border border-slate-200/80 overflow-hidden ${className}`}>
            {title && (
              <div className="px-4 py-3 border-b border-slate-100 bg-slate-50/70 flex justify-between items-center">
                <h3 className="font-bold text-slate-800 text-xs uppercase tracking-wider">{title}</h3>
              </div>
            )}
            <div className="p-4">{children}</div>
          </div>
        );

        function InputView({ onSave, settings, initialData, onCancelEdit }) {
          const [formData, setFormData] = useState(() => sanitizeRecord(initialData));
          const [aiText, setAiText] = useState('');
          const [isAiLoading, setIsAiLoading] = useState(false);
          const [aiError, setAiError] = useState('');

          useEffect(() => {
            setFormData(sanitizeRecord(initialData));
          }, [initialData]);

          const handleAIFill = async () => {
            if (!aiText.trim()) return;
            setIsAiLoading(true);
            setAiError('');
            try {
              const result = await callGeminiAPI(aiText);
              setFormData(prev => ({
                ...prev,
                ...result,
                personnel: (result.personnel || []).map(p => ({ 
                  ...p, 
                  id: generateId(), 
                  isFixed: settings.fixedPersonnel.some(fp => fp.name === p.name) || p.isFixed,
                  dayType: p.dayType || 'full',
                  dailyRate: p.dailyRate || 2500,
                  billable: false 
                })),
                tasks: (result.tasks || []).map(t => ({ 
                  ...t, 
                  id: generateId(),
                  billable: false 
                })),
                customItems: (result.customItems || []).map(c => ({ 
                  ...c, 
                  id: generateId(),
                  billable: false 
                })),
                costs: {
                  fuel: { cost: result.costs?.fuel?.cost || 0, billable: false, billingAmount: result.costs?.fuel?.billingAmount || 0 },
                  food: { cost: result.costs?.food?.cost || 0, billable: false, billingAmount: result.costs?.food?.billingAmount || 0 },
                  other: { cost: result.costs?.other?.cost || 0, billable: false, billingAmount: result.costs?.other?.billingAmount || 0 }
                }
              }));
            } catch (error) {
              setAiError(error.message || 'AI 解析失敗');
            } finally {
              setIsAiLoading(false);
            }
          };

          const handleInputChange = (field, value) => {
            setFormData(prev => {
              const updated = { ...prev, [field]: value };
              if (field === 'date' && value) {
                const ym = value.slice(0, 7);
                updated.billingDate = getDefaultBillingDate(ym);
              }
              return updated;
            });
          };
          
          const handleCostDetailChange = (costKey, field, value) => {
            setFormData(prev => ({
              ...prev,
              costs: {
                ...prev.costs,
                [costKey]: {
                  ...prev.costs[costKey],
                  [field]: field === 'billable' ? value : (Number(value) || 0)
                }
              }
            }));
          };

          const addFixedPersonnel = (fp) => {
            const isAlreadyAdded = formData.personnel.some(p => p.name === fp.name);
            if (isAlreadyAdded) {
              setFormData(prev => ({ ...prev, personnel: prev.personnel.filter(p => p.name !== fp.name) }));
            } else {
              setFormData(prev => ({ 
                ...prev, 
                personnel: [...prev.personnel, { id: generateId(), name: fp.name, isFixed: true, dayType: 'full', dailyRate: fp.fullDayRate || 2500, overtimePay: 0, bonus: 0, billable: false }] 
              }));
            }
          };

          const addPersonnel = (isFixed, name = '') => setFormData(prev => ({ 
            ...prev, 
            personnel: [...prev.personnel, { id: generateId(), name, isFixed, dayType: 'full', dailyRate: 2500, overtimePay: 0, bonus: 0, billable: false }] 
          }));

          const updatePersonnel = (id, field, value) => {
            setFormData(prev => ({ 
              ...prev, 
              personnel: prev.personnel.map(p => {
                if (p.id !== id) return p;
                let updated = { ...p };
                if (field === 'dayType') {
                  updated.dayType = value;
                  const matchedFp = settings.fixedPersonnel.find(fp => fp.name === p.name);
                  if (matchedFp) {
                    updated.dailyRate = value === 'full' ? matchedFp.fullDayRate : matchedFp.halfDayRate;
                  }
                } else if (field === 'name' || field === 'billable') {
                  updated[field] = value;
                } else {
                  updated[field] = Number(value) || 0;
                }
                return updated;
              }) 
            }));
          };

          const removePersonnel = (id) => setFormData(prev => ({ ...prev, personnel: prev.personnel.filter(p => p.id !== id) }));

          const addTask = () => setFormData(prev => ({ 
            ...prev, 
            tasks: [...prev.tasks, { id: generateId(), description: '', laborCost: 0, materialCost: 0, billingAmount: 0, billable: false }] 
          }));
          const updateTask = (id, field, value) => setFormData(prev => ({ 
            ...prev, 
            tasks: prev.tasks.map(t => t.id === id ? { ...t, [field]: field === 'description' || field === 'billable' ? value : (Number(value) || 0) } : t) 
          }));
          const removeTask = (id) => setFormData(prev => ({ ...prev, tasks: prev.tasks.filter(t => t.id !== id) }));

          const addCustomItem = () => setFormData(prev => ({
            ...prev,
            customItems: [...prev.customItems, { id: generateId(), name: '', qty: 1, price: 0, billable: false }]
          }));
          const updateCustomItem = (id, field, value) => setFormData(prev => ({
            ...prev,
            customItems: prev.customItems.map(c => c.id === id ? { ...c, [field]: field === 'name' || field === 'billable' ? value : (Number(value) || 0) } : c)
          }));
          const removeCustomItem = (id) => setFormData(prev => ({
            ...prev,
            customItems: prev.customItems.filter(c => c.id !== id)
          }));

          const autoBillingSum = useMemo(() => {
            let sum = 0;
            formData.personnel.forEach(p => {
              if (p.billable) sum += (Number(p.dailyRate) || 0) + (Number(p.overtimePay) || 0) + (Number(p.bonus) || 0);
            });
            formData.tasks.forEach(t => { if (t.billable) sum += Number(t.billingAmount) || 0; });
            formData.customItems.forEach(c => { if (c.billable) sum += (Number(c.qty) || 0) * (Number(c.price) || 0); });
            ['fuel', 'food', 'other'].forEach(key => {
              const c = formData.costs[key];
              if (c && c.billable) sum += Number(c.billingAmount) || 0;
            });
            return sum;
          }, [formData]);

          const totalBilling = formData.manualBilling !== '' && formData.manualBilling !== null && formData.manualBilling !== undefined ? Number(formData.manualBilling) : autoBillingSum;

          const summary = useMemo(() => {
            if (formData.type === 'holiday') return { totalCost: 0, totalBilling: 0, profit: 0 };
            const personnelCost = formData.personnel.reduce((sum, p) => sum + (Number(p.dailyRate) || 0) + (Number(p.overtimePay) || 0) + (Number(p.bonus) || 0), 0);
            const taskLaborCost = formData.tasks.reduce((sum, t) => sum + (Number(t.laborCost) || 0), 0);
            const taskMaterialCost = formData.tasks.reduce((sum, t) => sum + (Number(t.materialCost) || 0), 0);
            const customItemsCost = formData.customItems.reduce((sum, c) => sum + ((Number(c.qty) || 0) * (Number(c.price) || 0)), 0);
            const otherCosts = (Number(formData.costs?.fuel?.cost) || 0) + (Number(formData.costs?.food?.cost) || 0) + (Number(formData.costs?.other?.cost) || 0);
            
            const totalCost = personnelCost + taskLaborCost + taskMaterialCost + customItemsCost + otherCosts;
            return { totalCost, totalBilling, profit: totalBilling - totalCost };
          }, [formData, totalBilling]);

          const handleSubmit = (e) => {
            e.preventDefault();
            if (formData.type === 'holiday') {
              if (!formData.date) {
                alert('請填寫日期');
                return;
              }
              const finalRecord = { ...formData, projectName: '休假', client: '無', summary: { totalCost: 0, totalBilling: 0, profit: 0 }, personnel: [], tasks: [], customItems: [] };
              onSave(finalRecord);
              return;
            }

            if (!formData.projectName || !formData.date || !formData.client) {
              alert('請至少填寫工程名稱、日期與請款對象。');
              return;
            }
            const finalRecord = { ...formData, manualBilling: totalBilling, summary };
            onSave(finalRecord);
          };

          const isHoliday = formData.type === 'holiday';

          return (
            <div className="space-y-4 max-w-4xl mx-auto">
              {initialData && (
                <div className="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-lg flex justify-between items-center text-xs">
                  <span>正在編輯：<strong>{initialData.projectName}</strong></span>
                  <button type="button" onClick={onCancelEdit} className="bg-amber-200 px-2.5 py-1 rounded font-semibold cursor-pointer">取消</button>
                </div>
              )}

              {!isHoliday && (
                <Card title="AI 智能摘要填寫" className="border-blue-100 bg-blue-50/25">
                  <div className="flex flex-col sm:flex-row gap-2.5">
                    <textarea
                      className="flex-1 w-full p-2.5 text-xs rounded-lg border border-blue-200 bg-white outline-none"
                      rows="2"
                      placeholder="貼上今日工作筆記..."
                      value={aiText}
                      onChange={(e) => setAiText(e.target.value)}
                    />
                    <button
                      type="button"
                      onClick={handleAIFill}
                      disabled={isAiLoading || !aiText.trim()}
                      className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-semibold cursor-pointer self-end sm:self-auto"
                    >
                      {isAiLoading ? '解析中...' : '一鍵填寫'}
                    </button>
                  </div>
                  {aiError && <p className="text-rose-600 mt-1.5 text-[11px]">{aiError}</p>}
                </Card>
              )}

              <form onSubmit={handleSubmit} className="space-y-4">
                <Card title="基本資訊">
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    <div className="col-span-full">
                      <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">紀錄分類</label>
                      <div className="flex flex-wrap gap-4 text-xs">
                        <label className="flex items-center gap-1.5 cursor-pointer font-medium">
                          <input type="radio" name="type" value="contract" checked={formData.type === 'contract'} onChange={(e) => handleInputChange('type', e.target.value)} className="w-3.5 h-3.5 text-blue-600" />
                          <span>發包</span>
                        </label>
                        <label className="flex items-center gap-1.5 cursor-pointer font-medium">
                          <input type="radio" name="type" value="hourly" checked={formData.type === 'hourly'} onChange={(e) => handleInputChange('type', e.target.value)} className="w-3.5 h-3.5 text-blue-600" />
                          <span>計工時</span>
                        </label>
                        <label className="flex items-center gap-1.5 cursor-pointer font-medium">
                          <input type="radio" name="type" value="quotation" checked={formData.type === 'quotation'} onChange={(e) => handleInputChange('type', e.target.value)} className="w-3.5 h-3.5 text-amber-600" />
                          <span className="font-bold text-amber-600">報價</span>
                        </label>
                        <label className="flex items-center gap-1.5 cursor-pointer font-medium">
                          <input type="radio" name="type" value="holiday" checked={formData.type === 'holiday'} onChange={(e) => handleInputChange('type', e.target.value)} className="w-3.5 h-3.5 text-rose-500" />
                          <span className="font-bold text-rose-500">⛱️ 休假</span>
                        </label>
                      </div>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">日期 *</label>
                      <input type="date" value={formData.date} onChange={(e) => handleInputChange('date', e.target.value)} className="w-full p-2 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" required />
                    </div>

                    {!isHoliday && (
                      <>
                        <div>
                          <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">工程名稱 *</label>
                          <input type="text" value={formData.projectName} onChange={(e) => handleInputChange('projectName', e.target.value)} className="w-full p-2 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" required={!isHoliday} placeholder="工程名稱" />
                        </div>
                        <div>
                          <label className="block text-[11px] font-bold text-slate-500 uppercase mb-1">請款對象 *</label>
                          <input type="text" value={formData.client} onChange={(e) => handleInputChange('client', e.target.value)} className="w-full p-2 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" required={!isHoliday} placeholder="客戶" />

        function BillingView({ records, settings, onUpdateRecord, setOfficialInvoiceModal }) {
          const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
          const [selectedClient, setSelectedClient] = useState('全部');
          const [expandedProjects, setExpandedProjects] = useState({});

          const validRecords = useMemo(() => records.filter(r => r.type !== 'quotation' && r.type !== 'holiday'), [records]);
          
          const clients = useMemo(() => {
            const list = Array.from(new Set(validRecords.filter(r => r.date && r.date.startsWith(selectedMonth)).map(r => r.client)));
            return ['全部', ...list];
          }, [validRecords, selectedMonth]);

          useEffect(() => { 
            if (!clients.includes(selectedClient)) setSelectedClient('全部'); 
          }, [clients, selectedClient]);

          const clientRecords = useMemo(() => {
            return validRecords.filter(r => {
              if (!r.date || !r.date.startsWith(selectedMonth)) return false;
              if (selectedClient === '全部') return true;
              return r.client === selectedClient;
            });
          }, [validRecords, selectedMonth, selectedClient]);
          
          const groupedByProject = useMemo(() => {
            const map = {};
            clientRecords.forEach(r => {
              const pName = r.projectName || '未命名工程';
              const clientKey = selectedClient === '全部' ? `[${r.client || '散客'}] ${pName}` : pName;
              
              if (!map[clientKey]) {
                map[clientKey] = {
                  projectName: pName,
                  client: r.client || '散客',
                  records: [],
                  totalLabor: 0,
                  totalMaterial: 0,
                  totalExpenses: 0,
                  grandTotalBilling: 0,
                  isCollected: r.isCollected
                };
              }
              map[clientKey].records.push(r);
              
              let labor = 0;
              (r.personnel || []).forEach(p => { labor += (Number(p.dailyRate) || 0) + (Number(p.overtimePay) || 0) + (Number(p.bonus) || 0); });
              (r.tasks || []).forEach(t => { labor += Number(t.laborCost) || 0; });
              map[clientKey].totalLabor += labor;

              let material = 0;
              (r.tasks || []).forEach(t => { material += Number(t.materialCost) || 0; });
              (r.customItems || []).forEach(c => { material += (Number(c.qty) || 0) * (Number(c.price) || 0); });
              map[clientKey].totalMaterial += material;

              let exp = 0;
              ['fuel', 'food', 'other'].forEach(k => {
                exp += Number(r.costs?.[k]?.cost) || 0;
              });
              map[clientKey].totalExpenses += exp;

              map[clientKey].grandTotalBilling += r.summary?.totalBilling || 0;
            });
            return Object.values(map);
          }, [clientRecords, selectedClient]);

          const overallGrandTotal = groupedByProject.reduce((sum, item) => sum + item.grandTotalBilling, 0);

          const toggleExpand = (key) => {
            setExpandedProjects(prev => ({ ...prev, [key]: !prev[key] }));
          };

          const toggleProjectCollected = (proj, e) => {
            e.stopPropagation();
            const nextStatus = !proj.isCollected;

        function SalaryView({ records, settings, setOfficialSalaryModal }) {
          const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().slice(0, 7));
          const [selectedEmployee, setSelectedEmployee] = useState('全部');

          const allEmployeeNames = useMemo(() => {
            const setNames = new Set();
            records.forEach(r => {
              if (r.type !== 'quotation' && r.type !== 'holiday' && r.date && r.date.startsWith(selectedMonth)) {
                (r.personnel || []).forEach(p => { if (p.name) setNames.add(p.name); });
              }
            });
            return ['全部', ...Array.from(setNames)];
          }, [records, selectedMonth]);

          useEffect(() => {
            if (!allEmployeeNames.includes(selectedEmployee)) setSelectedEmployee('全部');
          }, [allEmployeeNames, selectedEmployee]);

          // 依照設定檔中的員工順序進行排序
          const salaryData = useMemo(() => {
            const monthRecords = records.filter(r => r.type !== 'quotation' && r.type !== 'holiday' && r.date && r.date.startsWith(selectedMonth));
            const employeeMap = {};

            monthRecords.forEach(r => {
              (r.personnel || []).forEach(p => {
                const name = p.name || '未具名';
                if (selectedEmployee !== '全部' && name !== selectedEmployee) return;

                if (!employeeMap[name]) {
                  employeeMap[name] = {
                    name,
                    totalDays: 0,
                    totalSalary: 0,
                    details: []
                  };
                }
                const dayValue = p.dayType === 'half' ? 0.5 : 1.0;
                const dailyPay = Number(p.dailyRate) || 0;
                const overtime = Number(p.overtimePay) || 0;
                const bonus = Number(p.bonus) || 0;
                const subTotal = dailyPay + overtime + bonus;

                employeeMap[name].totalDays += dayValue;
                employeeMap[name].totalSalary += subTotal;
                employeeMap[name].details.push({
                  date: r.date,
                  projectName: r.projectName,
                  dayType: p.dayType === 'half' ? '半日' : '全日',
                  dailyRate: dailyPay,
                  overtime,
                  bonus,
                  subTotal
                });
              });
            });

            // 取得員工排序權重
            const orderMap = {};
            settings.fixedPersonnel.forEach((fp, idx) => {
              orderMap[fp.name] = idx;
            });

            const unsortedData = Object.values(employeeMap);
            return unsortedData.sort((a, b) => {
              const idxA = orderMap[a.name] !== undefined ? orderMap[a.name] : 999;
              const idxB = orderMap[b.name] !== undefined ? orderMap[b.name] : 999;
              return idxA - idxB;
            });
          }, [records, selectedMonth, selectedEmployee, settings.fixedPersonnel]);

          return (
            <div className="space-y-4 max-w-4xl mx-auto">
              <div className="bg-white px-3 py-2 rounded-xl border border-slate-200 shadow-2xs flex items-center justify-between gap-2">

                    <span className="font-bold text-slate-500">月份:</span>

                  </div>
                  <div className="flex items-center gap-1">
                    <span className="font-bold text-slate-500">員工:</span>
                    <select value={selectedEmployee} onChange={e => setSelectedEmployee(e.target.value)} className="p-1 border border-slate-200 rounded font-bold bg-slate-50 text-xs max-w-[100px]">
                      {allEmployeeNames.map(name => <option key={name} value={name}>{name}</option>)}
                    </select>
                  </div>
                </div>
              </div>

              <div className="space-y-4">
                {salaryData.map(emp => (
                  <Card key={emp.name} title={`員工：${emp.name} (天數: ${emp.totalDays} 天 | 總薪資: $${emp.totalSalary.toLocaleString()})`}>
                    <div className="space-y-3">
                      <div className="border border-slate-200 rounded-lg overflow-x-auto hide-scrollbar">
                        <table className="w-full min-w-full text-left border-collapse text-[10px] bg-white">
                          <thead>
                            <tr className="bg-slate-100 border-b border-slate-200 text-slate-600 font-bold whitespace-nowrap">
                              <th className="px-2 py-1.5 w-[18%]">日期</th>
                              <th className="px-2 py-1.5 w-[34%]">工程名稱</th>
                              <th className="px-2 py-1.5 text-center w-[10%]">班別</th>
                              <th className="px-2 py-1.5 text-right w-[13%]">日薪</th>
                              <th className="px-2 py-1.5 text-right w-[10%]">加班</th>
                              <th className="px-2 py-1.5 text-right w-[15%]">小計</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {emp.details.map((d, idx) => (
                              <tr key={idx} className="hover:bg-slate-50 whitespace-nowrap">
                                <td className="px-2 py-1.5 font-mono text-slate-500">{d.date}</td>
                                <td className="px-2 py-1.5 font-semibold text-slate-800" title={d.projectName}>
                                  {d.projectName.length > 12 ? d.projectName.slice(0,12) + '...' : d.projectName}
                                </td>
                                <td className="px-2 py-1.5 text-center">{d.dayType}</td>
                                <td className="px-2 py-1.5 text-right">${d.dailyRate.toLocaleString()}</td>
                                <td className="px-2 py-1.5 text-right">${d.overtime.toLocaleString()}</td>
                                <td className="px-2 py-1.5 text-right font-bold text-blue-600">${d.subTotal.toLocaleString()}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>

                      <div className="text-right pt-2 border-t border-slate-100">
                        <button 
                          onClick={() => setOfficialSalaryModal([{
                            name: emp.name,
                            month: selectedMonth,
                            totalDays: emp.totalDays,

                        >
                          <span>📄 產生正式薪資單</span>
                        </button>
                      </div>
                    </div>
                  </Card>
                ))}
                {salaryData.length === 0 && (
                  <div className="bg-white p-8 rounded-xl border border-slate-200 text-center text-xs text-slate-400 font-medium">當月無薪資紀錄</div>
                )}
              </div>
            </div>
          );
        }

        function StatsView({ records }) {
          const validRecords = records.filter(r => r.type !== 'quotation' && r.type !== 'holiday');
          const total = validRecords.reduce((acc, r) => ({ billing: acc.billing + (r.summary?.totalBilling || 0), cost: acc.cost + (r.summary?.totalCost || 0), profit: acc.profit + (r.summary?.profit || 0) }), { billing: 0, cost: 0, profit: 0 });
          return (
            <div className="space-y-4 max-w-4xl mx-auto">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-center">

                <Card><p className="text-[11px] text-slate-500 font-bold uppercase mb-1">總成本</p><p className="text-xl font-black text-rose-600 whitespace-nowrap">${total.cost.toLocaleString()}</p></Card>
                <Card className="bg-blue-50/30 border-blue-200"><p className="text-[11px] text-blue-600 font-bold uppercase mb-1">總利潤</p><p className="text-xl font-black text-blue-700 whitespace-nowrap">${total.profit.toLocaleString()}</p></Card>
              </div>
            </div>
          );
        }

        function SettingsView({ settings, onSave, records, setRecords, showToast }) {
          const [form, setForm] = useState(settings);
          const [newName, setNewName] = useState('');
          const [newFullRate, setNewFullRate] = useState(2500);
          const [newHalfRate, setNewHalfRate] = useState(1300);
          const [importText, setImportText] = useState('');

          const handleFieldChange = (field, val) => setForm(prev => ({ ...prev, [field]: val }));

          const updatePersonRate = (index, field, rate) => {
            const updatedPersonnel = [...form.fixedPersonnel];
            updatedPersonnel[index] = { ...updatedPersonnel[index], [field]: Number(rate) || 0 };
            const updated = { ...form, fixedPersonnel: updatedPersonnel };
            setForm(updated);
            onSave(updated);
          };

          const addPerson = (e) => {
            e.preventDefault();
            if (!newName.trim()) return;
            const updated = { 
              ...form, 
              fixedPersonnel: [...form.fixedPersonnel, { name: newName.trim(), fullDayRate: Number(newFullRate) || 2500, halfDayRate: Number(newHalfRate) || 1300 }] 
            };
            setForm(updated);
            onSave(updated);
            setNewName('');
            setNewFullRate(2500);
            setNewHalfRate(1300);
          };

          const removePerson = (name) => {
            const updated = { ...form, fixedPersonnel: form.fixedPersonnel.filter(p => p.name !== name) };
            setForm(updated);
            onSave(updated);
          };

          const handleSaveSettings = (e) => {
            e.preventDefault();
            onSave(form);
          };

          const exportDataText = () => {
            const jsonStr = JSON.stringify({ records, settings });
            navigator.clipboard.writeText(jsonStr);
            showToast('備份代碼已成功複製到剪貼簿！可貼到 LINE 或備忘錄保存');
          };

          const importDataText = () => {
            if (!importText.trim()) {
              alert('請先貼上備份代碼文字');
              return;
            }
            try {
              const parsed = JSON.parse(importText.trim());
              if (parsed.records) setRecords(parsed.records);
              if (parsed.settings) {
                if (parsed.settings.fixedPersonnel && typeof parsed.settings.fixedPersonnel[0] === 'string') {
                  parsed.settings.fixedPersonnel = parsed.settings.fixedPersonnel.map(name => ({ name, fullDayRate: 2500, halfDayRate: 1300 }));
                }
                setForm(parsed.settings);
                onSave(parsed.settings);
              }
              showToast('資料還原成功！');
              setImportText('');
            } catch (err) {
              alert('備份代碼格式錯誤，請確認是否完整複製');
            }
          };

          return (
            <div className="space-y-4 max-w-2xl mx-auto">
              <Card title="公司/工作室抬頭設定 (用於請款單)">
                <form onSubmit={handleSaveSettings} className="space-y-3">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div className="relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">公司名稱</label>
                      <input type="text" value={form.companyName || ''} onChange={e => handleFieldChange('companyName', e.target.value)} className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" placeholder="例：順發工程行" />
                    </div>
                    <div className="relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">統一編號</label>
                      <input type="text" value={form.taxId || ''} onChange={e => handleFieldChange('taxId', e.target.value)} className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" placeholder="例：12345678" />
                    </div>
                    <div className="relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">聯絡電話</label>
                      <input type="text" value={form.phone || ''} onChange={e => handleFieldChange('phone', e.target.value)} className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white font-medium" placeholder="例：0912-345678" />
                    </div>
                  </div>
                  <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-semibold cursor-pointer whitespace-nowrap">儲存基本設定</button>
                </form>
              </Card>

              <Card title="固定班底與薪資管理">
                <div className="space-y-2.5 mb-4">
                  {form.fixedPersonnel.map((fp, index) => (
                    <div key={fp.name} className="flex flex-col sm:flex-row items-start sm:items-center justify-between bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs gap-3">
                      <span className="font-bold text-slate-800 text-sm whitespace-nowrap">{fp.name}</span>
                      <div className="flex items-center gap-2 w-full sm:w-auto">
                        <div className="flex-1 relative">
                          <label className="absolute -top-2 left-2 bg-slate-50 px-0.5 text-[10px] text-slate-500 font-bold">全日薪</label>
                          <input 
                            type="number" 
                            value={fp.fullDayRate} 
                            onChange={(e) => updatePersonRate(index, 'fullDayRate', e.target.value)} 
                            className="w-full p-1.5 pt-1.5 border border-slate-200 rounded bg-white text-xs text-right outline-none font-bold" 
                          />
                        </div>
                        <div className="flex-1 relative">
                          <label className="absolute -top-2 left-2 bg-slate-50 px-0.5 text-[10px] text-slate-500 font-bold">半日薪</label>
                          <input 
                            type="number" 
                            value={fp.halfDayRate} 
                            onChange={(e) => updatePersonRate(index, 'halfDayRate', e.target.value)} 
                            className="w-full p-1.5 pt-1.5 border border-slate-200 rounded bg-white text-xs text-right outline-none font-bold" 
                          />
                        </div>
                        <button type="button" onClick={() => removePerson(fp.name)} className="text-rose-500 hover:bg-rose-100 p-1.5 rounded cursor-pointer" title="移除">
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                <form onSubmit={addPerson} className="pt-3 border-t border-slate-200">
                  <h4 className="text-[11px] font-bold text-slate-600 uppercase mb-3">新增班底</h4>
                  <div className="flex flex-col sm:flex-row gap-2.5 mb-3">
                    <div className="flex-1 relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">姓名</label>
                      <input type="text" value={newName} onChange={e => setNewName(e.target.value)} placeholder="姓名" className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white" />
                    </div>
                    <div className="flex-1 relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">全日薪</label>
                      <input type="number" value={newFullRate} onChange={e => setNewFullRate(e.target.value)} placeholder="2500" className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white" />
                    </div>
                    <div className="flex-1 relative">
                      <label className="absolute -top-2 left-2.5 bg-white px-1 text-[10px] text-slate-500 font-bold">半日薪</label>
                      <input type="number" value={newHalfRate} onChange={e => setNewHalfRate(e.target.value)} placeholder="1300" className="w-full p-2.5 pt-3 text-xs border border-slate-200 rounded-lg outline-none bg-white" />
                    </div>
                  </div>
                  <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-semibold cursor-pointer whitespace-nowrap">新增班底</button>
                </form>
              </Card>

              <Card title="手機 App 專用備份與還原">
                <div className="space-y-3">
                  <p className="text-[11px] text-slate-500 leading-relaxed">
                    備份在手機上！
                  </p>
                  <button type="button" onClick={exportDataText} className="w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap">
                    📋 一鍵複製備份代碼
                  </button>
                  <div className="pt-2 border-t border-slate-100 space-y-2">
                    <label className="block text-[11px] font-bold text-slate-700">還原資料（請將備份代碼貼在下方）：</label>
                    <textarea 
                      rows="3" 
                      value={importText} 
                      onChange={e => setImportText(e.target.value)} 
                      placeholder="在此貼上剛剛複製的備份代碼文字..."
                      className="w-full p-2.5 text-xs border border-slate-200 rounded-xl outline-none font-mono"
                    ></textarea>
                    <button type="button" onClick={importDataText} className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap">
                      📥 執行還原資料
                    </button>
                  </div>
                </div>
              </Card>

            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
